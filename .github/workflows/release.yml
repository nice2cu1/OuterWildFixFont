name: Prepare release

# 发版必须手动触发；普通提交只执行 build.yml
on:
  workflow_dispatch:
    inputs:
      version:
        description: '可选版号（例如 3.0.5 或 v3.0.5）；留空自动递增'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: outerwildfixfont-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Select release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requested = $env:REQUESTED_VERSION.Trim() -replace '^v', ''
          if ($requested -and $requested -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Version must use X.Y.Z format, optionally prefixed with v.'
          }
          if ($requested -and [version]$requested -lt [version]'3.0.0') {
            throw 'Release version must be 3.0.0 or higher.'
          }
          $json = gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases.' }
          $releases = @($json | ConvertFrom-Json | ForEach-Object { $_ })
          # 同一个提交重跑时复用草稿；有其他待发布草稿时停止，避免跳号
          $drafts = @($releases | Where-Object {
            $_.draft -and $_.tag_name -match '^v?\d+\.\d+\.\d+$' -and
            [version]($_.tag_name -replace '^v', '') -ge [version]'3.0.0'
          })
          if ($drafts.Count -gt 0) {
            if ($drafts.Count -ne 1 -or $drafts[0].target_commitish -ne $env:GITHUB_SHA) {
              throw 'An unfinished release draft exists. Publish or delete it before preparing another release.'
            }
            $tag = $drafts[0].tag_name
            $version = $tag -replace '^v', ''
            if ($requested -and $requested -ne $version) {
              throw 'The requested version differs from the unfinished draft. Publish or delete that draft first.'
            }
          } else {
            $tags = @(git tag --list)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read tags.' }
            $versions = @(@($tags) + @($releases | ForEach-Object { $_.tag_name }) |
              Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]($_ -replace '^v', '') } |
              Where-Object { $_ -ge [version]'3.0.0' } | Sort-Object -Descending)
            $version = if ($requested) { $requested } elseif ($versions.Count -eq 0) { '3.0.0' } else {
              $latest = $versions[0]
              '{0}.{1}.{2}' -f $latest.Major, $latest.Minor, ($latest.Build + 1)
            }
            # 自选版本允许临时指定，但不能覆盖已有标签或 Release
            $occupied = @(@($tags) + @($releases | ForEach-Object { $_.tag_name }) |
              Where-Object { ($_ -replace '^v', '') -eq $version })
            if ($occupied.Count -gt 0) { throw "Version $version already exists." }
            $tag = "v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "reuse=$($drafts.Count -eq 1)" >> $env:GITHUB_OUTPUT
      - name: Build release package
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: OuterWildFixFont-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
      - name: Create or refresh draft
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REUSE_DRAFT: ${{ steps.version.outputs.reuse }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REUSE_DRAFT -eq 'True') {
            gh release upload $env:RELEASE_TAG $env:ARCHIVE $env:CHECKSUM --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:ARCHIVE $env:CHECKSUM --draft --target $env:GITHUB_SHA --title "OuterWildFixFont $env:RELEASE_VERSION" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare release draft.' }
          "Prepared draft $env:RELEASE_TAG. Review the assets and notes before publishing." >> $env:GITHUB_STEP_SUMMARY
